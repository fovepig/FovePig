name: Generate Snake

on:
  # run automatically every 24 hours
  schedule:
    - cron: "30 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from the github user's contribution graph
      - name: Generate snake svg from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # push the content of <build_dir> to the output branch
      # the svgs will be available at
      # https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
